# rules.toml for "MCP9808 breakout, I2C header, 3.3V" (V-2 example, proposed format)
# Sources: Microchip MCP9808 datasheet DS20005095B. Net names match the plan (V3_3, GND).

# Which part each reference in the rules is (V-2a). mpn is a part the user named;
# symbol (optional) is the KiCad symbol for its pin map.
[[part]]
ref    = "U1"
mpn    = "MCP9808"
symbol = "Sensor_Temperature:MCP9808_MSOP"

[[rule]]
on     = "U1.VDD"
need   = "cap"
to     = "GND"
value  = "100nF..1uF"
source = "MCP9808 datasheet, 6.1 Layout Considerations, p.35"
why    = "Recommended decoupling between VDD and GND, ceramic, placed right at the pins."

[[rule]]
on     = "U1.SDA"
need   = "pullup"
to     = "V3_3"
value  = "4.7k"
source = "MCP9808 datasheet, 3.1 Serial Data Line, p.11"
why    = "SDA is open-drain: the chip can only pull it low, so a resistor has to pull it high."

[[rule]]
on     = "U1.SCL"
need   = "pullup"
to     = "V3_3"
value  = "4.7k"
source = "MCP9808 datasheet, 4.0 Serial Communication; I2C bus is open-drain"
why    = "Same as SDA. 4.7k is a common choice for a short 3.3V bus."

[[rule]]
on     = "U1.A0"
need   = "tie"
to     = "GND"
source = "MCP9808 datasheet, Table 3-2, p.11"
why    = "Address is 0011 A2 A1 A0. The spec wants 0x18, so A2, A1 and A0 are all 0."

[[rule]]
on     = "U1.A1"
need   = "tie"
to     = "GND"
source = "MCP9808 datasheet, Table 3-2, p.11"
why    = "See A0."

[[rule]]
on     = "U1.A2"
need   = "tie"
to     = "GND"
source = "MCP9808 datasheet, Table 3-2, p.11"
why    = "See A0."

[[rule]]
on     = "U1.ALERT"
need   = "open"
source = "MCP9808 datasheet, 3.3 Alert, p.11"
why    = "Open-drain alert output. This board doesn't use it, so it stays unconnected."
