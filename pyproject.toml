[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openflux"
version = "0.1.0"
description = "Open-source AI PCB verifier"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
openflux = "openflux.cli:main"

[tool.setuptools.packages.find]
include = ["openflux*"]
