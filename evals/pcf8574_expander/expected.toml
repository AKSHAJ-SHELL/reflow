# Drafted by the agent (E-02, O-1). Checked by Akshaj Shandilya against the datasheets on 2026-10-31.
# Pin names are the KiCad symbol's in rules.toml [[part]] (V-12 relabels pins to them):
# Interface_Expansion:PCF8574T says GND where EasyEDA (C7605) says VSS.
status = "checked"
checked_by = "Akshaj Shandilya, 2026-10-31"
outcome = "board"

nets = ["V3_3", "GND", "SDA", "SCL", "P0", "P1", "P2", "P3", "P4", "P5", "P6", "P7"]
parts = { ic = 1, capacitor = 1, resistor = 2, connector = 2 }
violations = []

[[net]]
name = "V3_3"
includes = ["ic.VDD", "capacitor", "resistor", "connector"]
source = "PCF8574 datasheet pin table (SO16) and decoupling"

[[net]]
name = "GND"
includes = ["ic.GND", "ic.A0", "ic.A1", "ic.A2", "capacitor", "connector"]
source = "address 0x20 means A2..A0 low for the PCF8574 (not the PCF8574A)"

[[net]]
name = "SDA"
includes = ["ic.SDA", "resistor", "connector"]
source = "datasheet, checked by Akshaj Shandilya 2026-10-31"

[[net]]
name = "SCL"
includes = ["ic.SCL", "resistor", "connector"]
source = "datasheet, checked by Akshaj Shandilya 2026-10-31"

[[open]]
pins = ["ic.INT"]
source = "open-drain interrupt output, unused on this board"
